<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03080B" />
    <title>Reset password — RK ENTERPRISES</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page dashboard-page reset-page">
    <main class="reset-card">
      <a class="brand dashboard-brand" href="/"><span class="brand-mark">RK</span><span>RK <span>ENTERPRISES</span></span></a>
      <p class="eyebrow">Secure account recovery</p>
      <h1>Set a new password</h1>
      <p class="reset-copy">Choose a new password for your RK ENTERPRISES account. This link can only be used once.</p>
      <form id="resetForm">
        <label>New password<input id="resetPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>Confirm new password<input id="resetConfirm" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p id="resetMessage" class="dashboard-message" role="alert"></p>
        <button class="button button-primary" type="submit">Update password <span>→</span></button>
      </form>
    </main>
    <script src="/reset-password.js"></script>
  </body>
</html>
